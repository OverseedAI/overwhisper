name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify landing page keeps its analytics
        run: |
          grep -q '<script src="analytics.js"></script>' docs/index.html \
            || { echo '::error file=docs/index.html::Landing page no longer loads analytics.js — a redesign dropped the PostHog hook (this killed analytics once before, see eb7f6ca).'; exit 1; }
          grep -q "posthog.init('phc_" docs/analytics.js \
            || { echo '::error file=docs/analytics.js::analytics.js no longer initializes PostHog.'; exit 1; }
          grep -q "api_host: 'https://s.overseed.ai'" docs/analytics.js \
            || { echo '::error file=docs/analytics.js::PostHog must use the first-party analytics proxy.'; exit 1; }

  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Report toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          test "$(uname -m)" = arm64

      - name: Build
        run: |
          xcodebuild -project Overwhisper.xcodeproj \
            -scheme Overwhisper \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Archive Release (unsigned)
        run: |
          xcodebuild -project Overwhisper.xcodeproj \
            -scheme Overwhisper \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Overwhisper.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            archive

      - name: Verify archived app
        run: |
          APP_PATH="$RUNNER_TEMP/Overwhisper.xcarchive/Products/Applications/Overwhisper.app"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/Overwhisper")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")" = 14.0

      - name: Run regression tests
        run: swift test --skip-update
